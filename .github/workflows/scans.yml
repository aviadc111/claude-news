name: Market scans

on:
  schedule:
    # The analyst buy-ratings check, twice a day, every day:
    #   21:30 UTC  after the US market closes (23:30 in Israel in winter)
    #   06:30 UTC  a morning catch-up (08:30 in Israel in winter)
    # The ratings feed reaches GitHub a day or more late, so each run handles whatever
    # ratings days have newly arrived, one stock per ratings day at most.
    # The Friday whole-market dip check is switched off (friday_scan_enabled in worker/config.json).
    - cron: "30 21 * * *"
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      what:
        description: "Which scan to run"
        type: choice
        default: auto
        options: [auto, analysts, friday, both]
      force:
        description: "Handle ratings days again even if already handled"
        type: boolean
        default: false
      from:
        description: "Analyst check: handle ratings days after this date (YYYY-MM-DD, empty = automatic)"
        type: string
        default: ""
      dry:
        description: "Test only: print the result, send nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: market-scans
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - run: pip install -q -r worker/requirements.txt

      - name: Run the scans and send the messages
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          DEVICES_KEY: ${{ secrets.DEVICES_KEY }}
          TZ: Asia/Jerusalem
          WHAT: ${{ inputs.what || 'auto' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          FROM: ${{ inputs.from && format('--from {0}', inputs.from) || '' }}
          DRY: ${{ inputs.dry && '--dry' || '' }}
        run: python worker/scans.py $WHAT $FORCE $FROM $DRY

      - name: Save the results back to the repository
        run: |
          git config user.name "stock-checks[bot]"
          git config user.email "stock-checks@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "data: market scans $(date -u +'%Y-%m-%d %H:%M') UTC"
            for attempt in 1 2 3; do
              git pull --rebase --autostash && git push && break
              sleep 5
            done
          fi

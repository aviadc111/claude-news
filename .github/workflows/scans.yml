name: Market scans

on:
  schedule:
    # Monday-Friday 21:30 UTC, after the US market has closed (23:30 in Israel in winter).
    # Every day: the analyst buy-ratings check. On Fridays also the whole-market dip check.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      what:
        description: "Which scan to run"
        type: choice
        default: auto
        options: [auto, analysts, friday, both]
      force:
        description: "Run even if it already ran today"
        type: boolean
        default: false
      hours:
        description: "Analyst check: look back this many hours (empty = automatic)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: market-scans
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - run: pip install -q -r worker/requirements.txt

      - name: Run the scans and send the messages
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          DEVICES_KEY: ${{ secrets.DEVICES_KEY }}
          TZ: Asia/Jerusalem
          WHAT: ${{ inputs.what || 'auto' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          HOURS: ${{ inputs.hours && format('--hours {0}', inputs.hours) || '' }}
        run: python worker/scans.py $WHAT $FORCE $HOURS

      - name: Save the results back to the repository
        run: |
          git config user.name "stock-checks[bot]"
          git config user.email "stock-checks@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "data: market scans $(date -u +'%Y-%m-%d %H:%M') UTC"
            for attempt in 1 2 3; do
              git pull --rebase --autostash && git push && break
              sleep 5
            done
          fi

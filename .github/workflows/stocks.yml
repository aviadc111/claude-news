name: Stock dip checks

on:
  schedule:
    # GitHub is asked for a run every 15 minutes but really starts one every 1 to 2.5 hours.
    # So a run that starts in busy hours stays alive and checks on every quarter hour itself
    # (worker/loop.py): Monday to Friday 06:00 to 16:20 New York time, and every day up to the
    # 20:00 demo message while the app has a demo account. Outside busy hours a run checks
    # once and ends.
    # Between checks a run in busy hours listens for changes made in the app, so a stock that
    # is added shows up about a minute later instead of at the next quarter hour.
    # Each check picks up stocks added or picked in the app, refreshes the charts data, and
    # sends a sudden-dip alert when one happens (per stock: at most one in 14 days, unless it
    # falls another 7% since that message), and sends "The US market is open" once on every
    # trading day when the day's first prices are in.
    # While the market is open a run also publishes one-minute candles every minute for the app's
    # candles window, on the `live` branch (worker/live.py), and it sends a message when the price
    # reaches a line drawn in the app (worker/lines.py).
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read          # lets a run see that a newer run is waiting, so it can hand over

# One run works at a time. A newer run waits; the working run sees it and ends after its check.
concurrency:
  group: stock-checks
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - run: pip install -q -r worker/requirements.txt

      - name: Check prices, send messages, save data (repeats every 15 minutes in busy hours)
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          DEVICES_KEY: ${{ secrets.DEVICES_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}       # the contact the SEC asks programs for (Claude's demo)
          GITHUB_TOKEN: ${{ github.token }}
          TZ: Asia/Jerusalem
          PYTHONUNBUFFERED: "1"
        run: python worker/loop.py

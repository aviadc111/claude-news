name: Stock dip checks

on:
  schedule:
    # every 15 minutes while the US market can be open (13:00-21:59 UTC, Mon-Fri)
    - cron: "*/15 13-21 * * 1-5"
    # every 3 hours around the clock: picks up stock choices made in the app, refreshes the board
    - cron: "0 */3 * * *"
    # the weekly prices message, Sunday 08:30 Israel time (05:30 UTC in summer, 06:30 UTC in winter;
    # the script itself checks the Israel clock and sends once)
    - cron: "30 5,6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-checks
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - run: pip install -q -r worker/requirements.txt

      - name: Check prices, send alerts, write stocks.json
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          DEVICES_KEY: ${{ secrets.DEVICES_KEY }}
          TZ: Asia/Jerusalem
        run: python worker/run.py

      - name: Save data back to the repository
        run: |
          git config user.name "stock-checks[bot]"
          git config user.email "stock-checks@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "data: stocks $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash
            git push
          fi

name: Stock dip checks

on:
  schedule:
    # GitHub is asked for a run every 15 minutes but really starts one every 1 to 2.5 hours.
    # So a run that starts in busy hours stays alive and checks on every quarter hour itself
    # (worker/loop.py): Monday to Friday 06:00 to 16:20 New York time, and Sunday morning up to
    # the 08:30 weekly message, and every day up to the 20:00 demo message while the app has a
    # demo account. Outside busy hours a run checks once and ends.
    # Between checks a run in busy hours listens for changes made in the app, so a stock that
    # is added shows up about a minute later instead of at the next quarter hour.
    # Each check picks up stocks added or picked in the app, refreshes the charts data, sends
    # a sudden-dip alert when one happens, and sends the weekly prices message when it is due.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read          # lets a run see that a newer run is waiting, so it can hand over

# One run works at a time. A newer run waits; the working run sees it and ends after its check.
concurrency:
  group: stock-checks
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - run: pip install -q -r worker/requirements.txt

      - name: Check prices, send messages, save data (repeats every 15 minutes in busy hours)
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          DEVICES_KEY: ${{ secrets.DEVICES_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          TZ: Asia/Jerusalem
          PYTHONUNBUFFERED: "1"
        run: python worker/loop.py

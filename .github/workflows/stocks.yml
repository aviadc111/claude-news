name: Stock dip checks

on:
  schedule:
    # Every 15 minutes, around the clock. Each run picks up stocks added or picked in
    # the app, refreshes the charts data, sends a sudden-dip alert when one happens,
    # and on Sunday from 08:30 Israel time sends the weekly prices message once.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-checks
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - run: pip install -q -r worker/requirements.txt

      - name: Check prices, send messages, write stocks.json
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          DEVICES_KEY: ${{ secrets.DEVICES_KEY }}
          TZ: Asia/Jerusalem
        run: python worker/run.py

      - name: Save data back to the repository
        run: |
          git config user.name "stock-checks[bot]"
          git config user.email "stock-checks@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "data: stocks $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash
            git push
          fi
